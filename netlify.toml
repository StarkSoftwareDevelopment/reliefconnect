[build]
  publish = "public"
  functions = "netlify/functions"
  command = "echo 'window.SUPABASE_URL=\"'$SUPABASE_URL'\";window.SUPABASE_ANON_KEY=\"'$SUPABASE_ANON_KEY'\";window.GOOGLE_MAPS_KEY=\"'$GOOGLE_MAPS_KEY'\";window.COORDINATOR_EMAIL=\"'${COORDINATOR_EMAIL:-bjlinville1@gmail.com}'\";' > public/config.js && echo 'Build complete'"

# Never cache HTML or config
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Cache other JS aggressively
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA fallback
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
